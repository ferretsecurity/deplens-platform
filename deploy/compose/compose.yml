services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: deplens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deplens"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${DEPLENS_API_IMAGE:-ghcr.io/ferretsecurity/deplens-platform-api}:${DEPLENS_VERSION:-latest}
    restart: unless-stopped
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-https://localhost}
      BLOB_BACKEND: filesystem
      BLOB_FILESYSTEM_ROOT: /var/lib/deplens/blobs
      DEPLOYMENT_MODE: self-hosted
      HTTP_ADDRESS: :8080
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/deplens?sslmode=disable
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL:?set BOOTSTRAP_OWNER_EMAIL in .env}
      BOOTSTRAP_OWNER_PASSWORD: ${BOOTSTRAP_OWNER_PASSWORD:?set BOOTSTRAP_OWNER_PASSWORD in .env}
      MIGRATE_ON_START: "true"
      SESSION_COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - blobs-data:/var/lib/deplens/blobs

  web:
    image: ${DEPLENS_WEB_IMAGE:-ghcr.io/ferretsecurity/deplens-platform-web}:${DEPLENS_VERSION:-latest}
    restart: unless-stopped
    environment:
      API_INTERNAL_BASE_URL: http://api:8080
      NEXT_PUBLIC_APP_BASE_URL: ${APP_BASE_URL:-https://localhost}
    depends_on:
      - api

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  blobs-data:
  caddy_config:
  caddy_data:
  postgres-data:
