services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: deplens
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deplens"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-https://localhost}
      BLOB_BACKEND: filesystem
      BLOB_FILESYSTEM_ROOT: /var/lib/deplens/blobs
      DEPLOYMENT_MODE: self-hosted
      HTTP_ADDRESS: :8080
      DATABASE_URL: ${DATABASE_URL}
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL}
      BOOTSTRAP_OWNER_PASSWORD: ${BOOTSTRAP_OWNER_PASSWORD}
      BOOTSTRAP_API_TOKEN: ${BOOTSTRAP_API_TOKEN}
      MIGRATE_ON_START: "true"
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_SECRET: ${SESSION_COOKIE_SECRET}
      TRUST_PROXY: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - blobs-data:/var/lib/deplens/blobs

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_BASE_URL: ${API_INTERNAL_BASE_URL:-http://api:8080}
      NEXT_PUBLIC_APP_BASE_URL: ${APP_BASE_URL:-https://localhost}
    depends_on:
      - api

  caddy:
    image: caddy:2.8
    environment:
      APP_HOST: ${APP_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/compose/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  blobs-data:
  caddy_config:
  caddy_data:
  postgres-data:
