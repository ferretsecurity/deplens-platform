openapi: 3.1.0
info:
  title: Deplens Platform API
  version: 0.1.0
servers:
  - url: http://localhost:8080
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: deplens_session
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer reads require scan:read. Uploads require scan:write.
  schemas:
    SocketRun:
      type: object
      required: [id, status, started_at, finished_at, total, completed, failed, message]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [queued, running, completed, partial, failed, cancelled]}
        started_at: {type: string, format: date-time}
        finished_at: {type: [string, "null"], format: date-time}
        total: {type: integer}
        completed: {type: integer}
        failed: {type: integer}
        message: {type: string}
    SocketConfiguration:
      type: object
      required: [enabled, organization, token_configured, interval_minutes, next_run_at, last_run]
      properties:
        enabled: {type: boolean}
        organization: {type: string}
        token_configured: {type: boolean}
        interval_minutes: {type: integer, enum: [0, 60, 360, 720, 1440]}
        next_run_at: {type: [string, "null"], format: date-time}
        last_run:
          oneOf:
            - $ref: "#/components/schemas/SocketRun"
            - type: "null"
    SocketArtifact:
      type: object
      properties:
        id: {type: string}
        type: {type: string}
        namespace: {type: string}
        name: {type: string}
        version: {type: string}
        direct: {type: [boolean, "null"]}
        dev: {type: [boolean, "null"]}
        manifestFiles:
          type: array
          items:
            type: object
            properties:
              file: {type: string}
              start: {}
              end: {}
    RepositoryInventory:
      type: object
      properties:
        repository:
          $ref: "#/components/schemas/RepositorySummary"
        sources:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              available: {type: boolean}
              error: {type: string}
              synced_at: {type: [string, "null"], format: date-time}
              snapshot:
                type: [object, "null"]
                properties:
                  files: {type: array, items: {type: string}}
                  metadata:
                    type: object
                    properties:
                      branch: {type: string}
                      commit_hash: {type: string}
                      integration_repo_url: {type: string}
                      html_report_url: {type: string}
                      incomplete: {type: boolean}
                  artifacts:
                    type: array
                    items:
                      $ref: "#/components/schemas/SocketArtifact"
    ScanUploadRequest:
      type: object
      required: [schema_version, repository, source]
      anyOf:
        - required: [snapshot]
        - required: [report]
      properties:
        schema_version:
          type: string
          const: v1alpha1
        repository:
          $ref: "#/components/schemas/RepositoryInput"
        source:
          $ref: "#/components/schemas/SourceInput"
        labels:
          type: object
          additionalProperties:
            type: string
        annotation:
          type: string
        snapshot:
          $ref: "#/components/schemas/SnapshotInput"
        report:
          $ref: "#/components/schemas/NativeScannerReport"
          description: Complete native report. When present, its sources supply the inventory snapshot.
    NativeScannerReport:
      type: object
      additionalProperties: true
      required: [schema_version, root, sources, check_runs, findings]
      description: >-
        Complete native scanner JSON. All fields are retained in the scan artifact,
        including fields without inventory columns or a UI display. An accepted
        upload can contain partial, failed, or unsupported source extraction.
      properties:
        schema_version:
          type: integer
          const: 1
        root:
          type: string
          minLength: 1
        sources:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/NativeScannerSource"
        check_runs:
          type: [array, "null"]
          items:
            type: object
            additionalProperties: true
        findings:
          type: [array, "null"]
          items:
            type: object
            additionalProperties: true
        generation:
          type: [object, "null"]
          additionalProperties: true
    NativeScannerSource:
      type: object
      additionalProperties: true
      required: [detector, path, analysis]
      properties:
        detector:
          type: string
          minLength: 1
        path:
          type: string
          minLength: 1
        form:
          type: string
        roles:
          type: [array, "null"]
          items:
            type: string
        analysis:
          type: object
          required: [presence, extraction]
          properties:
            presence:
              type: string
              enum: [unknown, absent, present]
            extraction:
              type: string
              enum: [unsupported, complete, partial, failed]
        dependencies:
          type: [array, "null"]
          items:
            type: object
            additionalProperties: true
            properties:
              package_type:
                type: string
                description: Package ecosystem. Preserved verbatim; missing means unspecified.
        diagnostics:
          type: [array, "null"]
          items:
            type: object
            additionalProperties: true
    ScanReportResponse:
      type: object
      required: [report]
      properties:
        report:
          oneOf:
            - $ref: "#/components/schemas/NativeScannerReport"
            - type: "null"
    RepositoryInput:
      type: object
      required: [name, url, default_branch]
      properties:
        name:
          type: string
        url:
          type: string
        default_branch:
          type: string
    SourceInput:
      type: object
      required: [commit_sha, ref, scanned_at]
      properties:
        commit_sha:
          type: string
        ref:
          type: string
        scanned_at:
          type: string
          format: date-time
    SnapshotInput:
      type: object
      required: [root, manifests]
      properties:
        root:
          type: string
        manifests:
          type: array
          items:
            $ref: "#/components/schemas/ManifestInput"
        warnings:
          type: array
          items:
            type: string
    RawDeplensSnapshot:
      type: object
      description: Legacy raw snapshot without a schema_version field.
      required: [root, manifests]
      not:
        required: [schema_version]
      properties:
        root:
          type: string
        manifests:
          type: array
          items:
            $ref: "#/components/schemas/ManifestInput"
        warnings:
          type: array
          items:
            type: string
    ManifestInput:
      type: object
      required: [type, path, has_dependencies]
      properties:
        type:
          type: string
        path:
          type: string
        has_dependencies:
          type: [boolean, "null"]
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/DependencyInput"
        warnings:
          type: array
          items:
            type: string
    DependencyInput:
      type: object
      required: [raw]
      properties:
        package_type:
          type: string
          description: Package ecosystem supplied by the scanner. Empty means unspecified.
        raw:
          type: string
        name:
          type: string
        version:
          type: string
        constraint:
          type: string
        section:
          type: string
        source:
          type: string
        extras:
          type: object
          additionalProperties:
            type: string
    RepositorySummary:
      type: object
      required: [id, name, url, default_branch]
      properties:
        cli: {type: boolean}
        socket: {type: boolean}
        socket_url: {type: string}
        id:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
        default_branch:
          type: string
    RepositoryListResponse:
      type: object
      required: [items, pagination, filters]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RepositorySummary"
        pagination:
          $ref: "#/components/schemas/PaginationMetadata"
        filters:
          $ref: "#/components/schemas/RepositoryListFilters"
    PackageListResponse:
      type: object
      required: [items, pagination, filters]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PackageUsage"
        pagination:
          $ref: "#/components/schemas/PaginationMetadata"
        filters:
          type: object
          required: [q]
          properties:
            q: {type: string}
    PackageUsage:
      type: object
      required: [source, name, origin_kind, destination, version, constraint, ecosystem, repository_id, repository_name, manifest_path]
      properties:
        source: {type: string, enum: [cli, socket, snyk]}
        name:
          type: string
          description: Declared name or alias. Empty for unnamed URL or Git references.
        origin_kind:
          type: string
          description: Dependency origin reported by the scanner. Empty means unknown; independent of the provider in source.
        destination:
          type: string
          description: Direct URL or Git target. Empty when not reported or not a URL/Git origin.
        version: {type: string}
        constraint: {type: string}
        ecosystem: {type: string}
        repository_id: {type: string, format: uuid}
        repository_name: {type: string}
        manifest_path:
          type: [string, "null"]
          description: Null when the source does not report a manifest file.
    PaginationMetadata:
      type: object
      required: [page, page_size, total, total_pages, has_previous, has_next]
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
        has_previous:
          type: boolean
        has_next:
          type: boolean
    RepositoryListFilters:
      type: object
      required: [q]
      properties:
        q:
          type: string
    ScanSummary:
      type: object
      required: [id, repository_id, commit_sha, scanned_at, manifest_count, dependency_count, labels, annotation]
      properties:
        id:
          type: string
          format: uuid
        repository_id:
          type: string
          format: uuid
        commit_sha:
          type: string
        scanned_at:
          type: string
          format: date-time
        manifest_count:
          type: integer
        dependency_count:
          type: integer
        labels:
          type: object
          additionalProperties:
            type: string
        annotation:
          type: string
    ScanManifestListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScanManifest"
    ScanManifest:
      type: object
      required: [id, type, path, warnings, dependencies]
      properties:
        id:
          type: string
        type:
          type: string
        path:
          type: string
        has_dependencies:
          type: boolean
          nullable: true
        warnings:
          type: array
          items:
            type: string
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/ManifestDependency"
    ManifestDependency:
      type: object
      required: [id, raw, name, version, constraint, section, source, extras, package_type]
      properties:
        id:
          type: string
        package_type:
          type: string
          description: Package ecosystem supplied by the scanner. Empty means unspecified.
        raw:
          type: string
        name:
          type: string
        version:
          type: string
        constraint:
          type: string
        section:
          type: string
        source:
          type: string
        extras:
          type: [object, "null"]
          additionalProperties:
            type: string
    RepositoryManifestListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RepositoryManifest"
    RepositoryManifest:
      type: object
      required: [id, path, first_seen_at, last_seen_at, disappeared_at, is_active, labels]
      properties:
        id:
          type: string
          format: uuid
        path:
          type: string
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        disappeared_at:
          type: [string, "null"]
          format: date-time
        is_active:
          type: boolean
        labels:
          type: object
          additionalProperties:
            type: string
    DependencyListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DependencyListItem"
    DependencyListItem:
      type: object
      required: [raw, name, version, constraint, repository_count, manifest_file_count]
      properties:
        ecosystem: {type: string}
        raw:
          type: string
        name:
          type: string
        version:
          type: string
        constraint:
          type: string
        repository_count:
          type: integer
        manifest_file_count:
          type: integer
    APITokenMetadata:
      type: object
      required: [id, label, scopes, created_at]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum: [scan:read, scan:write, scan:metadata:write]
        created_at:
          type: string
          format: date-time
    APITokenInput:
      type: object
      required: [label, scopes]
      properties:
        label:
          type: string
        scopes:
          type: array
          minItems: 1
          items:
            type: string
            enum: [scan:read, scan:write, scan:metadata:write]
    CreatedAPIToken:
      allOf:
        - $ref: "#/components/schemas/APITokenMetadata"
        - type: object
          required: [token]
          properties:
            token:
              type: string
security:
  - bearerAuth: []
paths:
  /api/v1/integrations/socket:
    get:
      summary: Read Socket configuration without the token
      description: Requires a current owner or admin tenant membership.
      security: [{sessionAuth: []}]
      responses:
        "200":
          description: Configuration and most recent durable run
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SocketConfiguration"}
        "403": {description: Current administrator membership required}
    put:
      summary: Save Socket organization, token and schedule
      description: JSON and same-origin browser requests only. Omit token to preserve it. Disconnect before changing organization. Rejected during active synchronization.
      security: [{sessionAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization, interval_minutes]
              properties:
                organization: {type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]{0,99}$'}
                token: {type: string, writeOnly: true, minLength: 1, maxLength: 4096}
                interval_minutes: {type: integer, enum: [0, 60, 360, 720, 1440]}
      responses:
        "200": {description: Configuration saved}
        "400": {description: Invalid configuration}
        "403": {description: Current administrator membership or same origin required}
        "409": {description: Synchronization already active}
    delete:
      summary: Disconnect Socket and remove imported Socket data
      description: CLI repositories and scans are preserved. Requires JSON and same origin.
      security: [{sessionAuth: []}]
      responses:
        "200": {description: Disconnected}
        "403": {description: Current administrator membership or same origin required}
  /api/v1/integrations/socket/test:
    post:
      summary: Test saved Socket read permissions
      security: [{sessionAuth: []}]
      responses:
        "200": {description: Repository and full scan listing permissions verified}
        "502": {description: Socket access could not be verified}
  /api/v1/integrations/socket/sync:
    post:
      summary: Queue a durable manual synchronization
      security: [{sessionAuth: []}]
      responses:
        "200":
          description: Synchronization queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: {type: string, format: uuid}
        "409": {description: Synchronization already active}
  /api/v1/integrations/socket/status:
    get:
      summary: Read current configuration and latest synchronization status
      security: [{sessionAuth: []}]
      responses:
        "200":
          description: Configuration and durable progress counters
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SocketConfiguration"}
  /api/v1/integrations/socket/repositories/{repository_id}/mapping:
    put:
      summary: Explicitly map a Socket repository to a CLI repository in this tenant
      security: [{sessionAuth: []}]
      parameters:
        - {name: repository_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cli_repository_id]
              properties:
                cli_repository_id: {type: [string, "null"], format: uuid}
      responses:
        "200": {description: Mapping saved. Null keeps the Socket repository separate.}
        "403": {description: Current administrator membership required}
  /api/v1/repositories/{repository_id}/inventory:
    get:
      summary: Read a repository directly with its Socket inventory
      description: Requires a current tenant membership. Does not depend on repository list pagination.
      security: [{sessionAuth: []}]
      parameters:
        - {name: repository_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Repository and current Socket snapshots
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RepositoryInventory"}
        "404": {description: Repository not found in the current tenant}
  /api/v1/scans:
    get:
      summary: List scans for the current tenant
      parameters:
        - in: query
          name: repository_id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScanSummary"
    post:
      summary: Upload a scan snapshot
      description: >-
        Accepts native numeric schema version 1, legacy raw snapshots, and
        v1alpha1 upload envelopes. Raw uploads require the metadata headers below.
        Native reports are retained in full and projected into the inventory.
        Unsupported schema versions and malformed reports return HTTP 400.
      parameters:
        - in: header
          name: X-Deplens-Repository-Name
          required: false
          schema:
            type: string
          description: Required when uploading raw deplens JSON.
        - in: header
          name: X-Deplens-Repository-URL
          required: false
          schema:
            type: string
          description: Required when uploading raw deplens JSON.
        - in: header
          name: X-Deplens-Default-Branch
          required: false
          schema:
            type: string
          description: Required when uploading raw deplens JSON.
        - in: header
          name: X-Deplens-Commit-SHA
          required: false
          schema:
            type: string
          description: Required when uploading raw deplens JSON.
        - in: header
          name: X-Deplens-Ref
          required: false
          schema:
            type: string
          description: Required when uploading raw deplens JSON.
        - in: header
          name: X-Deplens-Scanned-At
          required: false
          schema:
            type: string
            format: date-time
          description: Required when uploading raw deplens JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/ScanUploadRequest"
                - $ref: "#/components/schemas/NativeScannerReport"
                - $ref: "#/components/schemas/RawDeplensSnapshot"
      responses:
        "201":
          description: Created
        "400":
          description: Invalid report, unsupported schema version, or missing upload metadata.
        "401":
          description: Unauthorized
  /api/v1/scans/{scan_id}:
    get:
      summary: Get a scan by ID
      parameters:
        - in: path
          name: scan_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanSummary"
  /api/v1/scans/{scan_id}/manifests:
    get:
      summary: List manifests for a scan
      parameters:
        - in: path
          name: scan_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Scan manifest detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanManifestListResponse"
  /api/v1/scans/{scan_id}/report:
    get:
      summary: Get the complete native scanner report
      description: >-
        Returns the retained native report for a scan in the authenticated tenant.
        Legacy uploads return report as null. Accepts a session or a bearer token
        with scan:read scope.
      parameters:
        - in: path
          name: scan_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Complete native report or null for a legacy upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanReportResponse"
        "400":
          description: Invalid scan ID.
        "401":
          description: Unauthorized
  /api/v1/scans/{scan_id}/metadata:
    patch:
      summary: Update scan labels and annotation
      parameters:
        - in: path
          name: scan_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /api/v1/repositories:
    get:
      summary: List repositories for the current tenant
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
            maxLength: 200
          description: Case-insensitive search across repository name and URL.
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: page_size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryListResponse"
  /api/v1/repositories/{repository_id}/manifests:
    get:
      summary: List durable manifest files for a repository
      parameters:
        - in: path
          name: repository_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Repository manifest lifecycle rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryManifestListResponse"
  /api/v1/packages:
    get:
      summary: Browse package usages for the current tenant
      description: >-
        Lists named dependencies in active CLI manifests and available Socket and Snyk
        snapshots, plus unnamed CLI URL/Git references with a destination.
        Excludes CLI local-path and workspace references, which remain in manifest details.
        Named dependencies with unknown origin remain visible. Identical usage rows are returned once. Different sources,
        versions, constraints, ecosystems, origins, destinations, repositories and manifest paths remain
        separate usages. Repository IDs and names use the linked inventory repository.
      parameters:
        - in: query
          name: q
          required: false
          schema: {type: string, maxLength: 200}
          description: Literal case-insensitive substring search on the package name or direct URL/Git destination. Surrounding whitespace is removed.
        - in: query
          name: page
          required: false
          schema: {type: integer, minimum: 1, default: 1}
        - in: query
          name: page_size
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
      responses:
        "200":
          description: Package usages with pagination totals, including empty pages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageListResponse"
        "400":
          description: Invalid query length or pagination, including an offset outside the supported integer range.
        "401":
          description: A tenant session or bearer token with scan:read is required.
  /api/v1/dependencies:
    get:
      summary: List active dependencies for the current tenant
      responses:
        "200":
          description: Active dependency usage rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DependencyListResponse"
  /api/v1/tokens:
    get:
      summary: List API token metadata for the active tenant
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APITokenMetadata"
        "401":
          description: Unauthorized
    post:
      summary: Create an API token for the active tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APITokenInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAPIToken"
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
  /api/v1/tokens/{token_id}:
    patch:
      summary: Update API token metadata for the active tenant
      parameters:
        - in: path
          name: token_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APITokenInput"
      responses:
