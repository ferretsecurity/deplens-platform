openapi: 3.1.0
info:
  title: Deplens Platform API
  version: 0.1.0
servers:
  - url: http://localhost:8080
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ScanUploadRequest:
      type: object
      required: [schema_version, project, repository, source, snapshot]
      properties:
        schema_version:
          type: string
          const: v1alpha1
        project:
          $ref: "#/components/schemas/ProjectInput"
        repository:
          $ref: "#/components/schemas/RepositoryInput"
        source:
          $ref: "#/components/schemas/SourceInput"
        labels:
          type: object
          additionalProperties:
            type: string
        annotation:
          type: string
        snapshot:
          $ref: "#/components/schemas/SnapshotInput"
    ProjectInput:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
        name:
          type: string
    RepositoryInput:
      type: object
      required: [slug, name, url, default_branch]
      properties:
        slug:
          type: string
        name:
          type: string
        url:
          type: string
        default_branch:
          type: string
    SourceInput:
      type: object
      required: [commit_sha, ref, scanned_at]
      properties:
        commit_sha:
          type: string
        ref:
          type: string
        scanned_at:
          type: string
          format: date-time
    SnapshotInput:
      type: object
      required: [root, manifests]
      properties:
        root:
          type: string
        manifests:
          type: array
          items:
            $ref: "#/components/schemas/ManifestInput"
        warnings:
          type: array
          items:
            type: string
    ManifestInput:
      type: object
      required: [type, path, has_dependencies]
      properties:
        type:
          type: string
        path:
          type: string
        has_dependencies:
          type: [boolean, "null"]
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/DependencyInput"
        warnings:
          type: array
          items:
            type: string
    DependencyInput:
      type: object
      required: [raw]
      properties:
        raw:
          type: string
        name:
          type: string
        version:
          type: string
        constraint:
          type: string
        section:
          type: string
        source:
          type: string
        extras:
          type: array
          items:
            type: string
security:
  - bearerAuth: []
paths:
  /api/v1/scans:
    post:
      summary: Upload a scan snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanUploadRequest"
      responses:
        "201":
          description: Created
  /api/v1/scans/{scan_id}:
    get:
      summary: Get a scan by ID
      parameters:
        - in: path
          name: scan_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /api/v1/scans/{scan_id}/metadata:
    patch:
      summary: Update scan labels and annotation
      parameters:
        - in: path
          name: scan_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /api/v1/projects:
    get:
      summary: List projects for the current tenant
      responses:
        "200":
          description: OK
  /api/v1/repositories:
    get:
      summary: List repositories for the current tenant
      responses:
        "200":
          description: OK
